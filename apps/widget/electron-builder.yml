appId: de.mediainterface.mira-guardian
productName: Memory-Bank Hüter
copyright: MediaInterface GmbH

directories:
  output: dist
  buildResources: build

# electron-vite bündelt Main und Preload inklusive Abhängigkeiten, deshalb
# reicht `out/` — node_modules muss nicht mitgepackt werden.
files:
  - out/**
  - package.json

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: mira-guardian-${version}-mac-${arch}.${ext}
  # Ohne Apple-Developer-Zertifikat wird unsigniert gebaut. Sobald Secrets
  # hinterlegt sind, greift Signierung automatisch (siehe release.yml).
  identity: null

win:
  target:
    - nsis
    - portable
  artifactName: mira-guardian-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: MediaInterface GmbH
  artifactName: mira-guardian-${version}-linux-${arch}.${ext}
