appId: de.mediainterface.mira-guardian
productName: Guardian
copyright: MediaInterface GmbH
# Bestimmt den Namen der ausführbaren Datei und damit auch des macOS-Bundles
# (Guardian.app). Ohne die Angabe leitet Linux den Namen aus dem Paketnamen
# (@guardian/widget) ab — als Dateiname unzulässig.
executableName: Guardian

directories:
  output: dist
  buildResources: build

# electron-vite bündelt Main und Preload inklusive Abhängigkeiten, deshalb
# reicht `out/` — node_modules muss nicht mitgepackt werden.
files:
  - out/**
  - package.json

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: mira-guardian-${version}-mac-${arch}.${ext}
  # Ad-hoc signieren ("-") statt gar nicht (null): Ohne Signierschritt bleibt
  # die Linker-Signatur auf einem Bundle zurück, das electron-builder danach
  # noch umbaut — macOS hält das für beschädigt ("ist beschädigt und kann
  # nicht geöffnet werden") statt nur für unsigniert. Mit Developer-ID-Secrets
  # überschreibt CSC_LINK diese Einstellung.
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - nsis
    - portable
  artifactName: mira-guardian-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: MediaInterface GmbH
  artifactName: mira-guardian-${version}-linux-${arch}.${ext}
  synopsis: Review-Werkzeug für Memory-Bank-Änderungen
