name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Die Tests importieren @guardian/shared über dist/, deshalb erst bauen.
      - run: pnpm --filter @guardian/shared build

      - run: pnpm test

      - name: Typprüfung
        run: |
          pnpm --filter @guardian/server exec tsc --noEmit -p tsconfig.json
          pnpm --filter @guardian/widget exec tsc --noEmit -p tsconfig.json
