name: Release

# Continuous Delivery: jeder Push auf main baut Container und Desktop-Apps
# und veröffentlicht sie als GitHub-Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Basisversion aus der Root-package.json, Patch-Stelle = Build-Nummer.
      # Dadurch ist jede Release-Version eindeutig und monoton steigend.
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  container:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Name kleinschreiben
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mira-guardian-server" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          # Ohne dieses Argument kennt der laufende Server seine Version nicht:
          # der Tag steckt am Image, nicht im Prozess.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifacts: "*.dmg,*.zip"
          - os: windows-latest
            artifacts: "*.exe"
          - os: ubuntu-latest
            artifacts: "*.AppImage,*.deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version setzen
        run: node -e "const f='apps/widget/package.json',p=require('./'+f);p.version='${{ needs.version.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - run: pnpm --filter @guardian/shared build
      - run: pnpm --filter @guardian/widget build

      # Die Keychain wird selbst aufgesetzt, statt CSC_LINK an electron-builder
      # zu geben: ein selbstsigniertes Zertifikat braucht einen
      # Vertrauenseintrag, sonst wird es als nicht vertrauenswürdig aussortiert
      # und der Build läuft ohne Signatur weiter (Begründung im Skript).
      - name: Signierschlüssel einrichten (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12_BASE64: ${{ secrets.MAC_CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: .github/scripts/mac-signierschluessel.sh

      # macOS getrennt, weil nur dort signiert wird: das selbstsignierte
      # Zertifikat auch für Windows einzusetzen brächte nichts (SmartScreen
      # kennt es ohnehin nicht), würde aber die Signaturprüfung des
      # Windows-Updaters daran binden.
      - name: Desktop-App paketieren (macOS, signiert)
        if: runner.os == 'macOS'
        run: pnpm --filter @guardian/widget exec electron-builder --config electron-builder.yml --publish never
        env:
          # Bewusst kein CSC_LINK: das würde electron-builder dazu bringen, die
          # .p12 in eine eigene Keychain ohne Vertrauenseintrag zu importieren.
          # CSC_KEYCHAIN zeigt auf die vorbereitete Keychain.
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}

      # electron-builder behandelt ein fehlgeschlagenes Signieren nur als
      # Warnung. Ohne diese Prüfung landet ein Bundle im Release, das sich nie
      # selbst aktualisieren kann — genau so entstanden zwei Releases, deren
      # Signatur macOS für beschädigt hielt.
      - name: Signatur und Update-Anforderung prüfen (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="$(find apps/widget/dist -maxdepth 2 -name 'Guardian.app' -print -quit)"
          [ -n "$APP" ] || { echo "Kein Guardian.app im dist-Verzeichnis." >&2; exit 1; }
          codesign --verify --strict --deep --verbose=1 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -q 'Authority=Guardian Code Signing'
          # Der eigentliche Prüfstein: Squirrel.Mac lässt ein Update nur durch,
          # wenn die Anforderung am Zertifikat hängt und nicht am cdhash eines
          # einzelnen Builds.
          codesign -d --requirements - "$APP" 2>&1 | grep -q 'certificate leaf'
          echo "Signatur in Ordnung, Update-Anforderung hängt am Zertifikat: $APP"

      - name: Desktop-App paketieren (Windows/Linux, unsigniert)
        if: runner.os != 'macOS'
        run: pnpm --filter @guardian/widget exec electron-builder --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          # latest*.yml und die blockmap-Dateien gehören zwingend ins Release:
          # die yml ist der Kanal, über den installierte Apps von einer neuen
          # Version erfahren, die blockmap spart beim Laden die unveränderten
          # Blöcke. Die drei Betriebssysteme schreiben verschiedene yml-Namen
          # (latest.yml, latest-mac.yml, latest-linux.yml) und kommen sich beim
          # Zusammenführen der Artefakte deshalb nicht in die Quere.
          path: |
            apps/widget/dist/*.dmg
            apps/widget/dist/*.zip
            apps/widget/dist/*.exe
            apps/widget/dist/*.AppImage
            apps/widget/dist/*.deb
            apps/widget/dist/latest*.yml
            apps/widget/dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, container, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Nur die Desktop-Artefakte — ohne pattern zieht der Schritt auch das
          # .dockerbuild-Artefakt der Container-Aktion, an dem er scheitert.
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            Automatischer Release aus `main` (Build ${{ github.run_number }}).

            **Server-Container**
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/mira-guardian-server:${{ needs.version.outputs.version }}
            ```

            **Desktop-Apps** — mit eigenem Zertifikat signiert, aber nicht
            notarisiert. macOS: App nach `/Applications` ziehen, dann einmalig
            `xattr -dr com.apple.quarantine /Applications/Guardian.app`
            (oder Rechtsklick → Öffnen). Windows: SmartScreen →
            *Weitere Informationen* → *Trotzdem ausführen*.

            Das ist nur beim ersten Mal nötig: Eine installierte App holt neue
            Versionen selbst und meldet sie in der Titelleiste. Ausnahmen sind
            das portable EXE und das DEB-Paket — die bleiben Handarbeit.
